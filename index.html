<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekomendasi Produk & Dashboard Affiliate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f8f9fa] min-h-screen pb-20">

  <!-- Navigation Bar (Switch Tab) -->
  <nav class="bg-white border-b sticky top-0 z-30 shadow-sm">
    <div class="max-w-md mx-auto px-4 flex justify-between items-center h-14">
      <div class="flex items-center gap-2">
        <span class="text-xl">🛍️</span>
        <span class="font-extrabold text-gray-800 text-sm tracking-tight">AffiliateHub</span>
      </div>
      <!-- Tab Switcher -->
      <div class="flex bg-gray-100 p-1 rounded-xl text-xs font-bold">
        <button id="tab-katalog-btn" onclick="switchTab('katalog')" class="px-3 py-1.5 rounded-lg bg-white text-orange-600 shadow-sm transition">
          Katalog
        </button>
        <button id="tab-admin-btn" onclick="switchTab('admin')" class="px-3 py-1.5 rounded-lg text-gray-500 hover:text-gray-800 transition">
          Admin
        </button>
      </div>
    </div>
  </nav>

  <!-- ================= TAMPILAN 1: KATALOG PUBLIK ================= -->
  <div id="view-katalog" class="block">
    <!-- Header Vibrant -->
    <header class="bg-gradient-to-r from-orange-500 via-red-500 to-pink-500 text-white rounded-b-[2rem] shadow-lg pb-5 pt-4">
      <div class="max-w-md mx-auto px-5 text-center">
        <h1 class="text-lg font-extrabold tracking-tight">Rekomendasi Produk Pilihan</h1>
        <p class="text-xs text-white/80 mt-1 font-medium">Klik produk favoritmu & belanja langsung di Shopee!</p>
        
        <!-- Search Input -->
        <div class="mt-4 relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">🔍</span>
          <input type="text" id="search-input" placeholder="Cari barang impianmu di sini..." 
            class="w-full text-sm pl-10 pr-4 py-2.5 rounded-2xl border-none focus:outline-none focus:ring-2 focus:ring-orange-300 bg-white text-gray-800 shadow-md transition-all">
        </div>

        <!-- Filter Kategori Kapsul -->
        <div class="flex gap-2 overflow-x-auto pt-4 no-scrollbar text-xs font-semibold" id="category-filter">
          <button onclick="filterCategory('Semua')" class="px-4 py-2 rounded-xl bg-white text-orange-600 shadow-md whitespace-nowrap transition-all" id="btn-Semua">Semua</button>
          <button onclick="filterCategory('Elektronik')" class="px-4 py-2 rounded-xl bg-white/20 text-white hover:bg-white/30 whitespace-nowrap transition-all" id="btn-Elektronik">Elektronik</button>
          <button onclick="filterCategory('Fashion')" class="px-4 py-2 rounded-xl bg-white/20 text-white hover:bg-white/30 whitespace-nowrap transition-all" id="btn-Fashion">Fashion</button>
          <button onclick="filterCategory('Home Decor')" class="px-4 py-2 rounded-xl bg-white/20 text-white hover:bg-white/30 whitespace-nowrap transition-all" id="btn-HomeDecor">Home Decor</button>
          <button onclick="filterCategory('Kecantikan')" class="px-4 py-2 rounded-xl bg-white/20 text-white hover:bg-white/30 whitespace-nowrap transition-all" id="btn-Kecantikan">Kecantikan</button>
          <button onclick="filterCategory('Lainnya')" class="px-4 py-2 rounded-xl bg-white/20 text-white hover:bg-white/30 whitespace-nowrap transition-all" id="btn-Lainnya">Lainnya</button>
        </div>
      </div>
    </header>

    <!-- Grid Produk -->
    <main class="max-w-md mx-auto px-4 mt-6">
      <div id="product-grid" class="grid grid-cols-2 gap-4">
        <div class="col-span-2 text-center py-12 text-gray-400 text-sm">Memuat produk...</div>
      </div>
    </main>
  </div>

  <!-- ================= TAMPILAN 2: DASHBOARD ADMIN ================= -->
  <div id="view-admin" class="hidden max-w-md mx-auto px-4 mt-6">
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
      <h2 class="text-base font-bold text-gray-800 mb-4 flex items-center gap-2">
        <span>➕</span> Tambah Produk Baru
      </h2>
      <form id="add-product-form" class="space-y-3.5 text-xs">
        <div>
          <label class="block font-semibold text-gray-600 mb-1">Judul Produk</label>
          <input type="text" id="title" required class="w-full p-2.5 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Kipas Angin Mini Portable">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-gray-600 mb-1">Kategori</label>
            <select id="category" class="w-full p-2.5 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500">
              <option value="Elektronik">Elektronik</option>
              <option value="Fashion">Fashion</option>
              <option value="Home Decor">Home Decor</option>
              <option value="Kecantikan">Kecantikan</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-gray-600 mb-1">Harga (Rp)</label>
            <input type="number" id="price" required class="w-full p-2.5 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="35000">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-gray-600 mb-1">URL Gambar Produk</label>
          <input type="url" id="image_url" required class="w-full p-2.5 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="https://...">
        </div>

        <div>
          <label class="block font-semibold text-gray-600 mb-1">Link Affiliate Shopee</label>
          <input type="url" id="affiliate_url" required class="w-full p-2.5 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="https://s.shopee.co.id/...">
        </div>

        <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-xl transition shadow-sm mt-2">
          Simpan Produk Baru
        </button>
      </form>
    </div>

    <!-- Tabel Kelola Produk Admin -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="text-base font-bold text-gray-800 mb-3 flex items-center gap-2">
        <span>📊</span> Kelola & Statistik Produk
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="border-b bg-gray-50 text-gray-500 font-semibold">
              <th class="p-2">Produk</th>
              <th class="p-2 text-center">Klik</th>
              <th class="p-2 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="admin-product-list" class="divide-y">
            <tr><td colspan="3" class="p-3 text-center text-gray-400">Memuat data admin...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDmaNHJfkPGwF3as7rCNhxoqDUxmoGqocI",
      authDomain: "dashboard-affiliate-d2343.firebaseapp.com",
      databaseURL: "https://dashboard-affiliate-d2343-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "dashboard-affiliate-d2343",
      storageBucket: "dashboard-affiliate-d2343.firebasestorage.app",
      messagingSenderId: "780596598828",
      appId: "1:780596598828:web:b450deef4990936a68d989"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const productsRef = ref(db, 'products');

    let allProducts = {};
    let currentCategory = 'Semua';

    // 1. Switch Navigation Tab (Katalog / Admin)
    window.switchTab = (tab) => {
      const viewKatalog = document.getElementById('view-katalog');
      const viewAdmin = document.getElementById('view-admin');
      const btnKatalog = document.getElementById('tab-katalog-btn');
      const btnAdmin = document.getElementById('tab-admin-btn');

      if (tab === 'katalog') {
        viewKatalog.classList.remove('hidden');
        viewAdmin.classList.add('hidden');
        btnKatalog.className = "px-3 py-1.5 rounded-lg bg-white text-orange-600 shadow-sm transition";
        btnAdmin.className = "px-3 py-1.5 rounded-lg text-gray-500 hover:text-gray-800 transition";
      } else {
        viewKatalog.classList.add('hidden');
        viewAdmin.classList.remove('hidden');
        btnAdmin.className = "px-3 py-1.5 rounded-lg bg-white text-orange-600 shadow-sm transition";
        btnKatalog.className = "px-3 py-1.5 rounded-lg text-gray-500 hover:text-gray-800 transition";
      }
    };

    // 2. Realtime Listener
    onValue(productsRef, (snapshot) => {
      allProducts = snapshot.val() || {};
      renderKatalog();
      renderAdminTable();
    });

    // 3. Render Katalog
    function renderKatalog() {
      const grid = document.getElementById('product-grid');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      grid.innerHTML = '';

      const keys = Object.keys(allProducts);
      let count = 0;

      keys.forEach((id) => {
        const item = allProducts[id];
        const matchCategory = currentCategory === 'Semua' || item.category === currentCategory;
        const matchSearch = item.title.toLowerCase().includes(searchQuery);

        if (matchCategory && matchSearch) {
          count++;
          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col justify-between';
          card.innerHTML = `
            <div>
              <div class="relative">
                <img src="${item.image_url}" alt="${item.title}" class="w-full h-36 object-cover bg-gray-50" onerror="this.src='https://via.placeholder.com/150'">
                <span class="absolute top-2 left-2 text-[9px] uppercase font-bold text-orange-700 bg-orange-100 px-2 py-0.5 rounded-md">
                  ${item.category}
                </span>
              </div>
              <div class="p-2.5">
                <h3 class="text-xs font-semibold text-gray-800 line-clamp-2 min-h-[32px]">${item.title}</h3>
                <p class="text-xs font-bold text-orange-600 mt-1">Rp ${item.price.toLocaleString('id-ID')}</p>
              </div>
            </div>
            <div class="p-2.5 pt-0">
              <button onclick="handleClick('${id}', '${item.affiliate_url}')" class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white text-xs font-bold py-2 rounded-xl text-center active:scale-95 transition">
                Beli di Shopee
              </button>
            </div>
          `;
          grid.appendChild(card);
        }
      });

      if (count === 0) {
        grid.innerHTML = `<div class="col-span-2 text-center py-10 text-gray-400 text-xs">Belum ada produk.</div>`;
      }
    }

    // 4. Render Tabel Admin
    function renderAdminTable() {
      const tbody = document.getElementById('admin-product-list');
      tbody.innerHTML = '';
      const keys = Object.keys(allProducts);

      if (keys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-gray-400">Belum ada data.</td></tr>`;
        return;
      }

      keys.forEach((id) => {
        const item = allProducts[id];
        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-50";
        tr.innerHTML = `
          <td class="p-2 font-medium text-gray-800 max-w-[140px] truncate">
            ${item.title}
            <div class="text-[10px] text-gray-400">Rp ${item.price.toLocaleString('id-ID')}</div>
          </td>
          <td class="p-2 text-center font-bold text-orange-600">${item.click_count || 0}</td>
          <td class="p-2 text-right">
            <button onclick="deleteProduct('${id}')" class="text-red-500 font-semibold hover:underline">Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 5. Form Tambah Produk
    document.getElementById('add-product-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const newProduct = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        price: Number(document.getElementById('price').value),
        image_url: document.getElementById('image_url').value,
        affiliate_url: document.getElementById('affiliate_url').value,
        click_count: 0,
        created_at: new Date().toISOString()
      };

      push(productsRef, newProduct).then(() => {
        alert('Produk berhasil ditambahkan!');
        document.getElementById('add-product-form').reset();
        switchTab('katalog'); // Otomatis pindah ke tab katalog untuk melihat hasilnya
      });
    });

    // 6. Delete & Click Action
    window.deleteProduct = (id) => {
      if (confirm('Hapus produk ini?')) remove(ref(db, `products/${id}`));
    };

    window.handleClick = (id, targetUrl) => {
      const clickRef = ref(db, `products/${id}/click_count`);
      runTransaction(clickRef, (count) => (count || 0) + 1).finally(() => {
        window.open(targetUrl, '_blank');
      });
    };

    document.getElementById('search-input').addEventListener('input', renderKatalog);
    window.filterCategory = (cat) => {
      currentCategory = cat;
      renderKatalog();
    };
  </script>
</body>
</html>
